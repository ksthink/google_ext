<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>드래그 영어 번역</title>
    <style>
      body {
        width: 240px;
        margin: 12px;
        font: 14px/1.5 system-ui, sans-serif;
        color-scheme: light dark;
        word-break: keep-all;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
        font-weight: 600;
      }
      label + label {
        margin-top: 8px;
      }
      .toggle {
        justify-content: space-between;
      }
      .toggle input {
        appearance: none;
        position: relative;
        flex: none;
        width: 36px;
        height: 20px;
        margin: 0;
        border-radius: 10px;
        background: #9ca3af;
        cursor: pointer;
        transition: background 0.15s;
      }
      .toggle input::before {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      .toggle input:checked {
        background: #2563eb;
      }
      .toggle input:checked::before {
        transform: translateX(16px);
      }
      .toggle input:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
      #status:empty {
        display: none;
      }
      #apiKey {
        box-sizing: border-box;
        width: 100%;
        margin-top: 4px;
      }
      .buttons {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .connection {
        display: flex;
        gap: 8px;
        align-items: baseline;
        margin-bottom: 10px;
        font-size: 13px;
      }
      #dot {
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #9ca3af;
      }
      #dot.connected {
        background: #16a34a;
      }
      #dot.disconnected {
        background: #dc2626;
      }
      p {
        margin: 8px 0 0;
        font-size: 12px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <label class="toggle">번역 <input id="enabled" type="checkbox" role="switch" /></label>
    <label class="toggle">학습 <input id="quizMode" type="checkbox" role="switch" /></label>
    <p id="status" role="status"></p>
    <hr />
    <div class="connection" role="status">
      <span id="dot" aria-hidden="true"></span>
      <span id="connection">연결 확인 중…</span>
    </div>
    <form id="keyForm">
      <label for="apiKey">Gemini API 키 (선택)</label>
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="API 키 입력" />
      <div class="buttons">
        <button type="submit">저장</button>
        <button id="deleteKey" type="button" hidden>삭제</button>
      </div>
    </form>
    <p>
      <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">무료 키 발급받기</a>
    </p>
    <script src="popup.js"></script>
  </body>
</html>
